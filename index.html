<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Little Mermaid’s Prince</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(to bottom, #1a4a6e, #071f33, #020c14);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1400px;
            max-height: 1000px;
            margin: auto;
            top: 50%;
            transform: translateY(-50%);
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            box-shadow: 0 0 40px rgba(0, 150, 255, 0.4);
            overflow: hidden;
            border: 4px solid #1e3c72;
            background-color: #071f33;
        }
        @media (max-width: 1400px), (max-height: 1000px) {
            #game-container {
                max-width: 100%;
                max-height: 100%;
                height: 100%;
                border: none;
                top: 0;
                transform: none;
            }
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            background-color: #071f33;
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }
        /* Neon Button */
        .neon-btn {
            padding: 15px 40px;
            font-size: 24px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.6);
            border: 3px solid #00f3ff;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 15px #00f3ff, inset 0 0 15px #00f3ff;
            text-shadow: 0 0 10px #00f3ff;
            animation: shine 1.5s infinite alternate;
            transition: all 0.3s ease;
            z-index: 20;
            -webkit-tap-highlight-color: transparent;
        }
        .neon-btn:hover, .neon-btn:active {
            background: #00f3ff;
            color: #000;
            box-shadow: 0 0 30px #00f3ff, 0 0 60px #00f3ff;
        }
        @keyframes shine {
            0% { box-shadow: 0 0 10px #00f3ff, inset 0 0 10px #00f3ff; }
            100% { box-shadow: 0 0 25px #00f3ff, inset 0 0 25px #00f3ff, 0 0 40px #00f3ff; }
        }
        /* HUD */
        #hud {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            color: #fff;
            text-shadow: 2px 2px 4px #000;
            z-index: 5;
            pointer-events: none;
        }
        #level-indicator {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 24px;
            color: #fff;
            text-shadow: 2px 2px 4px #000;
            z-index: 5;
            pointer-events: none;
        }
        #lives-indicator {
            position: absolute;
            top: 50px;
            left: 20px;
            font-size: 20px;
            color: #ff4466;
            text-shadow: 2px 2px 4px #000;
            z-index: 5;
            pointer-events: none;
        }
        /* Game Elements */
        #prince-wrapper {
            position: absolute;
            width: 160px;
            height: 160px;
            left: calc(50% - 80px);
            top: calc(50% - 30px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3;
            pointer-events: none;
        }
        #prince {
            position: absolute;
            width: 160px;
            height: 160px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transform-origin: center center;
            animation: tilt 3s ease-in-out infinite alternate;
            z-index: 3;
            filter: drop-shadow(0 0 8px #ffffff) drop-shadow(0 0 16px #ffffff) drop-shadow(0 0 25px #00f3ff) drop-shadow(0 0 40px #00f3ff);
        }
        @keyframes tilt {
            0% { transform: rotate(-10deg); }
            100% { transform: rotate(10deg); }
        }
        .siren {
            position: absolute;
            width: 65px;
            height: 65px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            z-index: 4;
            transform: translate(-50%, -50%);
            -webkit-tap-highlight-color: transparent;
        }
        .siren-medium {
            width: 78px;
            height: 78px;
        }
        .siren-large {
            width: 90px;
            height: 90px;
        }
        .red-helper {
            position: absolute;
            width: 360px;
            height: 360px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            z-index: 4;
            animation: floatAround 4s ease-in-out infinite alternate;
            -webkit-tap-highlight-color: transparent;
            transform: translate(-50%, -50%);
        }
        .prince1-helper {
            position: absolute;
            width: 180px;
            height: 180px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            z-index: 4;
            animation: floatAround 4s ease-in-out infinite alternate;
            -webkit-tap-highlight-color: transparent;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 0 15px #ffffff) drop-shadow(0 0 30px #00f3ff);
        }
        @keyframes floatAround {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) translate(20px, -20px) scale(1.05); }
            100% { transform: translate(-50%, -50%) translate(-20px, 20px) scale(0.95); }
        }
        .bubble {
            position: absolute;
            width: 25px;
            height: 25px;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(0,191,255,0.4));
            border-radius: 50%;
            box-shadow: inset 0 0 5px rgba(255,255,255,0.8), 0 0 8px rgba(0,191,255,0.6);
            z-index: 6;
            pointer-events: none;
        }
        .floating-bubble {
            position: absolute;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(0,191,255,0.3));
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            animation: riseUp linear infinite;
        }
        @keyframes riseUp {
            0% { transform: translateY(0) scale(1); opacity: 0.8; }
            100% { transform: translateY(-1000px) scale(1.5); opacity: 0; }
        }
        .heart {
            position: absolute;
            color: #ffffff;
            font-size: 22px;
            z-index: 12;
            pointer-events: none;
            text-shadow: 0 0 8px #00f3ff, 0 0 15px #ffffff;
            animation: streamHeart 2.5s ease-out infinite;
        }
        @keyframes streamHeart {
            0% { transform: translate(0, 0) scale(0.4); opacity: 1; }
            100% { transform: translate(-80px, -120px) scale(1.4); opacity: 0; }
        }
        #mermaid-fly {
            position: absolute;
            width: 600px;
            height: 600px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 11;
            pointer-events: none;
            transform: translate(-50%, -50%);
        }
        #warning-banner {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 0, 0, 0.7);
            color: white;
            padding: 10px 25px;
            font-size: 22px;
            border-radius: 10px;
            border: 2px solid #ffcc00;
            box-shadow: 0 0 15px #ff0000;
            z-index: 15;
            pointer-events: none;
            display: none;
            animation: flashWarning 0.5s ease infinite alternate;
        }
        @keyframes flashWarning {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        #modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 31, 51, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-box {
            background: linear-gradient(135deg, #103c6b, #05192d);
            border: 3px solid #00f3ff;
            border-radius: 20px;
            padding: 30px 40px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.6);
            max-width: 400px;
            width: 90%;
        }
        .modal-box h2 {
            color: #00f3ff;
            margin-top: 0;
            font-size: 28px;
            text-shadow: 0 0 10px #00f3ff;
        }
        .modal-box p {
            color: #fff;
            font-size: 18px;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- START SCREEN -->
    <div id="start-screen" class="screen" style="background-image: url('start.png');">
        <button id="start-btn" class="neon-btn" style="margin-top: 55vh;">Play</button>
    </div>

    <!-- GAME PLAY SCREEN -->
    <div id="game-screen" class="screen hidden" style="background-image: url('Background.png');">
        <div id="level-indicator">Level: <span id="current-level">1</span></div>
        <div id="lives-indicator">Lives: <span id="lives-count">3</span></div>
        <div id="hud">Time: <span id="timer">60</span>s</div>
        <div id="warning-banner">⚠️ Prince Attacked! ⚠️</div>
        <div id="prince-wrapper">
            <div id="prince" style="background-image: url('prince.png');"></div>
        </div>
    </div>

    <!-- CONGRATS 1 SCREEN -->
    <div id="congrats1-screen" class="screen hidden" style="background-image: url('congrats1.png');">
        <button id="next-btn-1" class="neon-btn" style="margin-top: 55vh;">Next Level</button>
    </div>

    <!-- CONGRATS 2 SCREEN -->
    <div id="congrats2-screen" class="screen hidden" style="background-image: url('congrats2.png');">
        <button id="next-btn-2" class="neon-btn" style="margin-top: 55vh;">Next Level</button>
    </div>

    <!-- CONGRATS 3 SCREEN -->
    <div id="congrats3-screen" class="screen hidden" style="background-image: url('congrats3.png');">
        <button id="restart-btn" class="neon-btn" style="margin-top: 55vh;">Play Again</button>
    </div>

    <!-- THEMED RESTART MODAL -->
    <div id="modal-overlay" class="hidden">
        <div class="modal-box">
            <h2>🧜‍♀️ Mermaid's Alert 🧜‍♂️</h2>
            <p id="modal-text">The sirens got too close! Try this level again.</p>
            <button id="modal-restart-btn" class="neon-btn" style="font-size: 18px; padding: 10px 25px;">Retry Level</button>
        </div>
    </div>
</div>

<script>
    const sirenImages = ['s1.png', 's2.png', 's3.png', 's4.png', 's5.png', 's6.png', 's7.png', 's8.png'];
    let currentLevel = 1;
    let timerValue = 60;
    let playerLives = 3;
    let gameInterval = null;
    let spawnInterval = null;
    let redSpawnInterval = null;
    let prince1SpawnInterval = null;
    let gameEntities = [];
    let isPlaying = false;
    let sirenImageIndex = 0;
    let warningTimeout = null;

    const startScreen = document.getElementById('start-screen');
    const gameScreen = document.getElementById('game-screen');
    const congrats1Screen = document.getElementById('congrats1-screen');
    const congrats2Screen = document.getElementById('congrats2-screen');
    const congrats3Screen = document.getElementById('congrats3-screen');
    const startBtn = document.getElementById('start-btn');
    const nextBtn1 = document.getElementById('next-btn-1');
    const nextBtn2 = document.getElementById('next-btn-2');
    const restartBtn = document.getElementById('restart-btn');
    const timerDisplay = document.getElementById('timer');
    const levelDisplay = document.getElementById('current-level');
    const livesDisplay = document.getElementById('lives-count');
    const warningBanner = document.getElementById('warning-banner');
    const modalOverlay = document.getElementById('modal-overlay');
    const modalRestartBtn = document.getElementById('modal-restart-btn');

    function createBackgroundBubbles() {
        for (let i = 0; i < 20; i++) {
            let b = document.createElement('div');
            b.classList.add('floating-bubble');
            let size = Math.random() * 25 + 10;
            b.style.width = size + 'px';
            b.style.height = size + 'px';
            b.style.left = Math.random() * 100 + '%';
            b.style.bottom = '-30px';
            b.style.animationDuration = (Math.random() * 3 + 2) + 's';
            b.style.animationDelay = (Math.random() * 5) + 's';
            startScreen.appendChild(b);
        }
    }
    createBackgroundBubbles();

    startBtn.addEventListener('click', () => {
        startScreen.classList.add('hidden');
        gameScreen.classList.remove('hidden');
        initLevel(1);
    });

    nextBtn1.addEventListener('click', () => {
        congrats1Screen.classList.add('hidden');
        gameScreen.classList.remove('hidden');
        initLevel(2);
    });

    nextBtn2.addEventListener('click', () => {
        congrats2Screen.classList.add('hidden');
        gameScreen.classList.remove('hidden');
        initLevel(3);
    });

    restartBtn.addEventListener('click', () => {
        congrats3Screen.classList.add('hidden');
        startScreen.classList.remove('hidden');
    });

    modalRestartBtn.addEventListener('click', () => {
        modalOverlay.classList.add('hidden');
        gameScreen.classList.remove('hidden');
        initLevel(currentLevel);
    });

    function initLevel(level) {
        currentLevel = level;
        levelDisplay.textContent = currentLevel;
        playerLives = 3;
        livesDisplay.textContent = playerLives;

        // All 3 stages set to 60 seconds
        timerValue = 60;
        timerDisplay.textContent = timerValue;
        clearEntities();
        isPlaying = true;

        spawnSirensCount(currentLevel === 1 ? 1 : (currentLevel === 2 ? 2 : 2));

        gameInterval = setInterval(() => {
            timerValue--;
            timerDisplay.textContent = timerValue;
            if (timerValue <= 0) {
                winLevel();
            }
        }, 1000);

        // Level 3 siren spawn rate made easier/slower
        let spawnRate = currentLevel === 1 ? 1200 : (currentLevel === 2 ? 800 : 700);
        spawnInterval = setInterval(() => {
            spawnSirensCount(1);
        }, spawnRate);

        if (currentLevel >= 2) {
            redSpawnInterval = setInterval(() => {
                spawnRedHelper();
            }, 10000);
        }

        if (currentLevel === 3) {
            prince1SpawnInterval = setInterval(() => {
                spawnPrince1Helper();
            }, 12000);
        }

        requestAnimationFrame(updateGameLoop);
    }

    function spawnSirensCount(count) {
        for (let i = 0; i < count; i++) {
            spawnSiren();
        }
    }

    function clearEntities() {
        clearInterval(gameInterval);
        clearInterval(spawnInterval);
        clearInterval(redSpawnInterval);
        clearInterval(prince1SpawnInterval);
        gameEntities.forEach(e => e.element.remove());
        gameEntities = [];
    }

    function spawnSiren() {
        if (!isPlaying) return;
        let el = document.createElement('div');
        el.classList.add('siren');
        
        let imgIndex = sirenImageIndex % sirenImages.length;
        let img = sirenImages[imgIndex];
        sirenImageIndex++;

        if (imgIndex === 1 || imgIndex === 6) {
            el.classList.add('siren-medium');
        } else if (imgIndex === 2 || imgIndex === 3) {
            el.classList.add('siren-large');
        }

        el.style.backgroundImage = `url('${img}')`;

        let containerRect = gameScreen.getBoundingClientRect();
        let cx = containerRect.width / 2;
        let cy = containerRect.height / 2;
        
        let angle = Math.random() * Math.PI * 2;
        let spawnDist = Math.max(containerRect.width, containerRect.height) * 0.7;
        let x = cx + Math.cos(angle) * spawnDist;
        let y = cy + Math.sin(angle) * spawnDist;

        el.style.left = x + 'px';
        el.style.top = y + 'px';

        let entity = {
            element: el,
            x: x,
            y: y,
            type: 'siren',
            angle: angle,
            speed: 1.2 + (currentLevel * 0.3),
            wobble: Math.random() * 10,
            wobbleSpeed: 0.05 + Math.random() * 0.05
        };

        el.addEventListener('click', (e) => {
            e.stopPropagation();
            eliminateEntity(entity);
        });
        el.addEventListener('touchstart', (e) => {
            e.stopPropagation();
            e.preventDefault();
            eliminateEntity(entity);
        }, { passive: false });

        gameScreen.appendChild(el);
        gameEntities.push(entity);
    }

    function spawnRedHelper() {
        if (!isPlaying) return;
        let el = document.createElement('div');
        el.classList.add('red-helper');
        el.style.backgroundImage = `url('red.png')`;

        let containerRect = gameScreen.getBoundingClientRect();
        let x = Math.random() * (containerRect.width - 300) + 150;
        let y = Math.random() * (containerRect.height - 300) + 150;

        el.style.left = x + 'px';
        el.style.top = y + 'px';

        let entity = {
            element: el,
            x: x,
            y: y,
            type: 'red'
        };

        el.addEventListener('click', (e) => {
            e.stopPropagation();
            activateRedPower(entity);
        });
        el.addEventListener('touchstart', (e) => {
            e.stopPropagation();
            e.preventDefault();
            activateRedPower(entity);
        }, { passive: false });

        gameScreen.appendChild(el);
        gameEntities.push(entity);

        setTimeout(() => {
            if (entity.element.parentNode) {
                entity.element.remove();
                gameEntities = gameEntities.filter(en => en !== entity);
            }
        }, 5000);
    }

    function activateRedPower(redEntity) {
        let sirens = gameEntities.filter(e => e.type === 'siren');
        sirens.sort((a, b) => {
            let distA = Math.hypot(a.x - redEntity.x, a.y - redEntity.y);
            let distB = Math.hypot(b.x - redEntity.x, b.y - redEntity.y);
            return distA - distB;
        });

        // Defeats 5 nearest sirens
        let targets = sirens.slice(0, 5);
        targets.forEach(target => {
            createBubbleAttack(redEntity, target);
        });

        redEntity.element.remove();
        gameEntities = gameEntities.filter(e => e !== redEntity);
    }

    function spawnPrince1Helper() {
        if (!isPlaying) return;
        let el = document.createElement('div');
        el.classList.add('prince1-helper');
        el.style.backgroundImage = `url('prince1.png')`;

        let containerRect = gameScreen.getBoundingClientRect();
        let x = Math.random() * (containerRect.width - 200) + 100;
        let y = Math.random() * (containerRect.height - 200) + 100;

        el.style.left = x + 'px';
        el.style.top = y + 'px';

        let entity = {
            element: el,
            x: x,
            y: y,
            type: 'prince1'
        };

        el.addEventListener('click', (e) => {
            e.stopPropagation();
            activatePrince1Power(entity);
        });
        el.addEventListener('touchstart', (e) => {
            e.stopPropagation();
            e.preventDefault();
            activatePrince1Power(entity);
        }, { passive: false });

        gameScreen.appendChild(el);
        gameEntities.push(entity);

        setTimeout(() => {
            if (entity.element.parentNode) {
                entity.element.remove();
                gameEntities = gameEntities.filter(en => en !== entity);
            }
        }, 5000);
    }

    function activatePrince1Power(princeEntity) {
        let sirens = gameEntities.filter(e => e.type === 'siren');
        sirens.sort((a, b) => {
            let distA = Math.hypot(a.x - princeEntity.x, a.y - princeEntity.y);
            let distB = Math.hypot(b.x - princeEntity.x, b.y - princeEntity.y);
            return distA - distB;
        });

        let targets = sirens.slice(0, 7);
        
        princeEntity.element.remove();
        gameEntities = gameEntities.filter(e => e !== princeEntity);

        targets.forEach(target => {
            createSuckAnimation(target, princeEntity);
        });
    }

    function createSuckAnimation(target, center) {
        let startTime = performance.now();
        let duration = 400;
        let startX = target.x;
        let startY = target.y;

        function animateSuck(currentTime) {
            let elapsed = currentTime - startTime;
            let progress = Math.min(elapsed / duration, 1);
            
            let currentX = startX + (center.x - startX) * progress;
            let currentY = startY + (center.y - startY) * progress;
            let scale = 1 - progress * 0.8;

            target.x = currentX;
            target.y = currentY;
            target.element.style.left = currentX + 'px';
            target.element.style.top = currentY + 'px';
            target.element.style.transform = `translate(-50%, -50%) scale(${scale})`;

            if (progress < 1) {
                requestAnimationFrame(animateSuck);
            } else {
                eliminateEntity(target);
            }
        }
        requestAnimationFrame(animateSuck);
    }

    function createBubbleAttack(from, to) {
        let bubble = document.createElement('div');
        bubble.classList.add('bubble');
        bubble.style.left = from.x + 'px';
        bubble.style.top = from.y + 'px';
        gameScreen.appendChild(bubble);

        let startTime = performance.now();
        let duration = 500;

        function animateBubble(currentTime) {
            let elapsed = currentTime - startTime;
            let progress = Math.min(elapsed / duration, 1);
            
            let currentX = from.x + (to.x - from.x) * progress;
            let currentY = from.y + (to.y - from.y) * progress;

            bubble.style.left = currentX + 'px';
            bubble.style.top = currentY + 'px';

            if (progress < 1) {
                requestAnimationFrame(animateBubble);
            } else {
                bubble.remove();
                eliminateEntity(to);
            }
        }
        requestAnimationFrame(animateBubble);
    }

    function eliminateEntity(entity) {
        let index = gameEntities.indexOf(entity);
        if (index > -1) {
            entity.element.remove();
            gameEntities.splice(index, 1);
        }
    }

    function updateGameLoop() {
        if (!isPlaying) return;

        let containerRect = gameScreen.getBoundingClientRect();
        let cx = containerRect.width / 2;
        let cy = containerRect.height / 2 + 50;

        for (let i = gameEntities.length - 1; i >= 0; i--) {
            let entity = gameEntities[i];
            if (entity.type === 'siren') {
                entity.wobble += entity.wobbleSpeed;
                
                let dx = cx - entity.x;
                let dy = cy - entity.y;
                let dist = Math.hypot(dx, dy);

                if (dist < 45) {
                    eliminateEntity(entity);
                    handlePrinceHit();
                    if (!isPlaying) return;
                    continue;
                }

                let baseAngle = Math.atan2(dy, dx);
                let complexAngle = baseAngle + Math.sin(entity.wobble) * 0.8;

                entity.x += Math.cos(complexAngle) * entity.speed;
                entity.y += Math.sin(complexAngle) * entity.speed;

                entity.element.style.left = entity.x + 'px';
                entity.element.style.top = entity.y + 'px';
            }
        }

        if (isPlaying) {
            requestAnimationFrame(updateGameLoop);
        }
    }

    function handlePrinceHit() {
        playerLives--;
        livesDisplay.textContent = playerLives;

        warningBanner.style.display = 'block';
        clearTimeout(warningTimeout);
        warningTimeout = setTimeout(() => {
            warningBanner.style.display = 'none';
        }, 1200);

        if (playerLives <= 0) {
            isPlaying = false;
            clearEntities();
            gameScreen.classList.add('hidden');
            modalOverlay.classList.remove('hidden');
        }
    }

    function winLevel() {
        isPlaying = false;
        clearEntities();
        gameScreen.classList.add('hidden');

        if (currentLevel === 1) {
            congrats1Screen.classList.remove('hidden');
            setupCongratsScreen(congrats1Screen);
        } else if (currentLevel === 2) {
            congrats2Screen.classList.remove('hidden');
            setupCongratsScreen(congrats2Screen);
        } else if (currentLevel === 3) {
            congrats3Screen.classList.remove('hidden');
            setupCongratsScreen(congrats3Screen);
        }
    }

    function setupCongratsScreen(screen) {
        let mermaid = document.createElement('div');
        mermaid.id = 'mermaid-fly';
        mermaid.style.backgroundImage = "url('mermaid.png')";
        screen.appendChild(mermaid);

        let mX = screen.clientWidth / 2, mY = screen.clientHeight / 2, mSpeedX = 2.5, mSpeedY = 2;
        
        let moveAnim = setInterval(() => {
            mX += mSpeedX;
            mY += mSpeedY;
            if (mX <= 250 || mX >= screen.clientWidth - 250) mSpeedX *= -1;
            if (mY <= 250 || mY >= screen.clientHeight - 250) mSpeedY *= -1;
            mermaid.style.left = mX + 'px';
            mermaid.style.top = mY + 'px';
        }, 30);

        let heartInterval = setInterval(() => {
            if (!screen.classList.contains('hidden')) {
                let heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = '🤍';
                // Spawn delicate white hearts precisely from mermaid's left hand position relative to center
                heart.style.left = (mX - 110) + 'px';
                heart.style.top = (mY - 30) + 'px';
                screen.appendChild(heart);
                setTimeout(() => heart.remove(), 2500);
            } else {
                clearInterval(heartInterval);
                clearInterval(moveAnim);
                mermaid.remove();
            }
        }, 400);
    }
</script>
